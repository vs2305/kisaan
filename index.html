<body>
  <style>
    /* Layout: one narrow column. Illustrated hero card, photo/colour input, then a result card with severity band, precautions and an emergency box. */
    :root {
      --bg: #eef2ea;
      --ink: #16211a;
      --mut: #53625a;
      --card: #fff;
      --line: #d3dccf;
      --tile: #f1f5ee;
      --do: #1e7a3c;
      --no: #c62828;
      --sky: #cfe7f1;
      --hill1: #a8cf9e;
      --hill2: #7db478;
      --soil: #a9794d;
      --soil2: #8c6036;
      --crop: #2f8f46;
      --sun: #f6c445;
      --cloud: #ffffff;
      --shadow-sm: 0 1px 2px rgba(22, 33, 26, .07), 0 1px 1px rgba(22, 33, 26, .04);
      --shadow-md: 0 10px 26px rgba(22, 33, 26, .10), 0 2px 6px rgba(22, 33, 26, .06);
      --bar-h: 58px;
      box-sizing: border-box
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #111a14;
        --ink: #eef2ec;
        --mut: #9fb0a5;
        --card: #1a261e;
        --line: #2e3e33;
        --tile: #233229;
        --do: #62d08a;
        --no: #ff7a73;
        --sky: #1d3a4a;
        --hill1: #2b5a3b;
        --hill2: #234832;
        --soil: #5b4129;
        --soil2: #47321f;
        --crop: #4fb066;
        --sun: #e9c46a;
        --cloud: #8fb3c4;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
        --shadow-md: 0 12px 28px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #111a14;
      --ink: #eef2ec;
      --mut: #9fb0a5;
      --card: #1a261e;
      --line: #2e3e33;
      --tile: #233229;
      --do: #62d08a;
      --no: #ff7a73;
      --sky: #1d3a4a;
      --hill1: #2b5a3b;
      --hill2: #234832;
      --soil: #5b4129;
      --soil2: #47321f;
      --crop: #4fb066;
      --sun: #e9c46a;
      --cloud: #8fb3c4;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.55 "Noto Sans Devanagari", "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--card);
      z-index: 10
    }

    .appbar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: var(--bar-h);
      padding: 8px 16px;
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }

    .appbar .wrap {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: none
    }

    .brand .mark {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 9px;
      background: var(--crop);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .brand .mark svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .brand strong {
      font-size: 1.02rem;
      line-height: 1.1;
      white-space: nowrap
    }

    .seg {
      margin-left: auto;
      display: flex;
      gap: 2px;
      background: var(--tile);
      border-radius: 999px;
      padding: 3px;
      flex: none
    }

    .seg button {
      min-height: 32px;
      border: none;
      border-radius: 999px;
      padding: 0 10px;
      font-size: .82rem;
      font-weight: 600;
      background: transparent;
      color: var(--mut);
      box-shadow: none
    }

    .seg button[aria-pressed="true"] {
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow-sm)
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    h1 {
      font-size: 1.5rem;
      line-height: 1.25;
      margin: 0;
      font-weight: 700;
      text-wrap: balance
    }

    h3 {
      font-size: 1.05rem;
      line-height: 1.3;
      margin: 0;
      font-weight: 700
    }

    p {
      margin: 0
    }

    .mut {
      color: var(--mut);
      font-size: .92rem
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    button,
    .btn {
      font: inherit;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 14px;
      padding: 12px 14px;
      min-height: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: transform .12s ease, box-shadow .12s ease
    }

    button:active,
    .btn:active {
      transform: scale(.97)
    }

    button:focus-visible,
    .btn:focus-visible {
      outline: 3px solid #1565c0;
      outline-offset: 2px
    }

    button:disabled {
      opacity: .45;
      cursor: default;
      transform: none
    }

    .primary {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
      flex: 1;
      text-align: center;
      box-shadow: var(--shadow-md)
    }

    .alt {
      flex: 1;
      text-align: center
    }

    .btn svg,
    .row button svg {
      width: 22px;
      height: 22px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .actions {
      gap: 10px
    }

    .actions .btn {
      flex-direction: column;
      gap: 7px;
      min-height: 84px;
      padding: 14px 10px;
      border-radius: 18px
    }

    .actions .btn svg {
      width: 26px;
      height: 26px
    }

    .actions .btn span {
      font-size: .88rem
    }

    .hero {
      border-radius: 20px;
      overflow: hidden;
      background: var(--card);
      box-shadow: var(--shadow-md)
    }

    .hero svg {
      display: block;
      width: 100%;
      height: auto
    }

    .hero .txt {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    canvas {
      width: 100%;
      max-width: 100%;
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
      cursor: crosshair;
      display: none
    }

    .picker {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .sw {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px
    }

    .sw button {
      height: 60px;
      width: 60px;
      padding: 0;
      margin: 0 auto;
      border: none;
      border-radius: 999px;
      box-shadow: var(--shadow-md)
    }

    .sw button svg {
      width: 30px;
      height: 30px
    }

    #res {
      display: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      background: var(--card)
    }

    #band {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .brow {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .bi {
      flex: none;
      width: 64px;
      height: 64px
    }

    .bi svg {
      width: 100%;
      height: 100%
    }

    #band h2 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.25;
      font-weight: 700
    }

    #rs {
      margin-top: 2px
    }

    .gauge {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px
    }

    .gauge span {
      height: 10px;
      border-radius: 5px;
      background: currentColor;
      opacity: .28
    }

    .gauge span.on {
      opacity: 1
    }

    .bi svg,
    .sw button svg {
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round
    }

    .bi .h,
    .sw .h {
      fill: var(--bandc);
      stroke: none
    }

    .bi .l,
    .sw .l {
      fill: none
    }

    #body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .items {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .items li {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .ic {
      flex: none;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: var(--tile);
      box-shadow: inset 0 0 0 1.5px var(--line);
      padding: 6px
    }

    .items li.do .ic {
      box-shadow: inset 0 0 0 1.5px var(--do)
    }

    .items li.no .ic {
      box-shadow: inset 0 0 0 1.5px var(--no)
    }

    .ic svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ic svg .x {
      stroke: var(--no);
      stroke-width: 3.2
    }

    .ic svg .f {
      fill: var(--ink);
      fill-opacity: .14
    }

    .ic svg .n {
      fill: var(--ink);
      stroke: none;
      font: 700 15px "Noto Sans", system-ui, sans-serif
    }

    .em {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm), inset 0 0 0 1.5px var(--no)
    }

    .emh {
      background: #b3261e;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .emh svg {
      width: 30px;
      height: 30px;
      flex: none;
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .em .items {
      padding: 12px 14px 14px
    }

    #err {
      color: var(--no);
      font-weight: 600;
      display: none
    }

    .player {
      background: var(--tile);
      border-radius: 999px;
      padding: 6px;
      gap: 6px;
      flex-wrap: nowrap
    }

    .player button {
      border: none;
      box-shadow: none;
      border-radius: 999px;
      background: transparent;
      min-height: 42px
    }

    .player .primary {
      box-shadow: var(--shadow-sm)
    }

    .player button:disabled {
      box-shadow: none
    }

    .off {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .off::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--do);
      flex: none
    }
  </style>
  <header class="appbar">
    <div class="wrap">
      <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19c7 1 12-3 13-11-7 .5-11 4-13 11z" />
            <path d="M5 19c2-5 5-8 9-9" />
          </svg></span><strong>Kisan Suraksha</strong></div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lhi" aria-pressed="true">हिन्दी</button><button id="lmr" aria-pressed="false">मराठी</button><button
          id="len" aria-pressed="false">English</button>
      </div>
    </div>
  </header>
  <main>
    <div class="hero">
      <div id="scene" aria-hidden="true"></div>
      <div class="txt">
        <h1 id="t"></h1>
        <p id="sub" class="mut"></p>
        <p id="off" class="mut off"></p>
      </div>
    </div>
    <div class="row actions"><label class="btn primary" for="f" id="pick" tabindex="0"></label><input id="f" type="file"
        accept="image/*" capture="environment" hidden><label class="btn alt" for="g" id="upl"
        tabindex="0"></label><input id="g" type="file" accept="image/*" hidden></div>

      r /= 255;
      g /= 255;
      b /= 255;
      const m = Math.max(r, g, b),
        n = Math.min(r, g, b),
        d = m - n;
      if (m < .25 || d / m < .35) return null;
      let h = d === 0 ? 0 : m === r ? ((g - b) / d) % 6 : m === g ? (b - r) / d + 2 : (r - g) / d + 4;

      if (h < 20 || h > 340) return 'red';
      if (h > 38 && h < 68) return 'yellow';
      if (h > 85 && h < 165) return 'green';
      if (h > 190 && h < 255) return 'blue';
      return null
    }

        known: v.length > 0
      }
    }

    function note() {
      const n = $('vnote');
      if (lg !== 'mr' || !cur) {
        n.hidden = true;
        return
      }
      const p = pickVoice();
      n.textContent = L.mr.vnote;
      n.hidden = !(p.known && !p.exact)
    }

    function steps(s) {
      return (s.emg.match(/[^.।]+[.।]?/g) || [s.emg]).map(x => x.trim()).filter(Boolean)
    }

    function list(arr, icons, types) {
      return arr.map((x, i) => '<li class="' + (types[i] || 'do') + '"><span class="ic">' + (IC[icons[i]] || IC.hosp) +
        '</span><span>' + x + '</span></li>').join('')
    }

    function ui() {
      halt();
      const s = L[lg];
      $('t').textContent = s.t;
      $('sub').textContent = s.sub;
      $('off').textContent = s.off;
      $('pick').innerHTML = BTN.cam + '<span>' + s.pick + '</span>';
      $('upl').innerHTML = BTN.up + '<span>' + UP[lg] + '</span>';
      $('hint').textContent = s.hint;
      $('or').textContent = s.or;
      $('err').textContent = s.err;
      $('rh').textContent = s.rh;
      $('eh').textContent = s.eh;
      $('rules').innerHTML = list(s.rules, RI, RT);
      $('emg').innerHTML = list(steps(s), EI, ET);
      $('sw').innerHTML = '';
      Object.keys(C).forEach(k => {
        const b = document.createElement('button');
        b.style.background = C[k].c;
        b.style.color = C[k].f;
        b.style.setProperty('--bandc', C[k].c);
        b.innerHTML = BI[k];
        b.setAttribute('aria-label', C[k][lg][0]);
        b.onclick = () => show(k);
        $('sw').appendChild(b)
      });
      Object.keys(LB).forEach(k => $(LB[k]).setAttribute('aria-pressed', lg === k));
      document.documentElement.lang = lg;
      if (cur) show(cur, true);
      note()
    }

    function show(k, quiet) {
      cur = k;
      $('err').style.display = 'none';
      const c = C[k],
        t = c[lg];
      const b = $('band');
      b.style.background = c.c;
      b.style.color = c.f;
      b.style.setProperty('--bandc', c.c);
      $('bi').innerHTML = BI[k];
      $('rt').textContent = t[0];
      $('rs').textContent = t[1];
      $('gg').innerHTML = [1, 2, 3, 4].map(n => '<span class="' + (n <= LV[k] ? 'on' : '') + '"></span>').join('');
      $('gg').setAttribute('aria-label', LV[k] + '/4');
      $('res').style.display = 'block';
      note();
      if (!quiet) {
        $('res').scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
        speak()
      }
    }

    function mkChunks() {
      const s = L[lg],
        t = C[cur][lg];
      return [t[0] + '. ' + t[1]].concat(s.rules, steps(s))
    }

    function say(i) {
      if (i >= chunks.length) {
        st = 'idle';
        setCtl();
        return
      }
      ci = i;
      const my = tok;
      try {
        const s = L[lg],
          u = new SpeechSynthesisUtterance(chunks[i]),
          p = pickVoice();
        u.lang = p.voice ? p.voice.lang : s.lang;
        if (p.voice) u.voice = p.voice;
        u.rate = .9;
        u.onend = () => {
          if (my === tok) say(i + 1)
        };
        u.onerror = () => {
          if (my === tok) {
            st = 'idle';
            setCtl()
          }
        };
        speechSynthesis.speak(u)
      } catch (e) {
        st = 'idle';
        setCtl()
      }
    }

    function speak() {
      if (!cur) return;
      halt();
      chunks = mkChunks();
      st = 'playing';
      setCtl();
      say(0)
    }
    $('emi').innerHTML = IC.cross;
    $('scene').innerHTML = scene();
    $('lhi').onclick = () => {
      lg = 'hi';
      ui()
    };
    $('lmr').onclick = () => {
      lg = 'mr';
      ui()
    };
    $('len').onclick = () => {
      lg = 'en';
      ui()
    };
    $('stp').onclick = halt;
    $('spk').onclick = () => {
      if (st === 'idle') speak();
      else if (st === 'playing') {
        tok++;
        try {
          speechSynthesis.cancel()
        } catch (e) {}
        st = 'paused';
        setCtl()
      } else if (st === 'paused') {
        st = 'playing';
        say(ci)
      }
    };
    try {
      speechSynthesis.addEventListener('voiceschanged', note)
    } catch (e) {}
    $('pick').onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        $('f').click()
      }
    };
    $('upl').onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        $('g').click()
      }
    };
    const cv = $('cv'),
      cx = cv.getContext('2d', {
        willReadFrequently: true
      });
    const ld = e => {
      const f = e.target.files[0];
      if (!f) return;
      const im = new Image();
      im.onload = () => {
        const w = Math.min(640, im.width),
          h = Math.round(im.height * w / im.width);
        cv.width = w;
        cv.height = h;
        cx.drawImage(im, 0, 0, w, h);
        cv.style.display = 'block';
        $('hint').style.display = 'block';
        URL.revokeObjectURL(im.src)
      };
      im.src = URL.createObjectURL(f)
    };
    $('f').onchange = ld;
    $('g').onchange = ld;
    cv.onclick = e => {
      const r = cv.getBoundingClientRect(),
        x = Math.round((e.clientX - r.left) * cv.width / r.width),
        y = Math.round((e.clientY - r.top) * cv.height / r.height),
        R = 10;
      const d = cx.getImageData(Math.max(0, x - R), Math.max(0, y - R), 2 * R, 2 * R).data;
      let a = 0,
        g = 0,
        b = 0,
        n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) {
        a += d[i];
        g += d[i + 1];
        b += d[i + 2]
      }
      const k = classify(a / n, g / n, b / n);
      if (k) show(k);
      else {
        $('err').style.display = 'block'
      }
    };
    ui();
    /* ---------- offline support: if this page and sw.js are hosted together, cache the app for repeat offline use ---------- */
    try {
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js').catch(() => {})
      }
    } catch (e) {}
  </script>

</body>

</html>
